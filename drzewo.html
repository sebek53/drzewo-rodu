<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drzewo rodu</title>
<style>
:root{--bg:#fff;--canvas:#f2f2f2;--card:#fff;--ink:#333;--mut:#777;--line:#ccc;--soft:#eee;--acc:#f26a2e;--sel:#00a3b4;--link:#105a83;--m:#5b8fc7;--f:#d96f9c;
  --hdr:radial-gradient(647% 232% at 125% 74%,#ffd8b7 0,#fff 100%);--shadow:0 2px 8px rgba(0,0,0,.12)}
:root[data-theme=dark]{--bg:#1b1b1d;--canvas:#141416;--card:#25252a;--ink:#e8e8e8;--mut:#9a9a9a;--line:#3d3d44;--soft:#2e2e34;--link:#7fc3ea;
  --hdr:radial-gradient(647% 232% at 125% 74%,#5a3420 0,#1b1b1d 100%);--shadow:0 2px 10px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#1b1b1d;--canvas:#141416;--card:#25252a;--ink:#e8e8e8;--mut:#9a9a9a;--line:#3d3d44;--soft:#2e2e34;--link:#7fc3ea;
  --hdr:radial-gradient(647% 232% at 125% 74%,#5a3420 0,#1b1b1d 100%);--shadow:0 2px 10px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--card)}
a,.lnk{color:var(--link);cursor:pointer;text-decoration:none}a:hover,.lnk:hover{text-decoration:underline}
small,.mut{color:var(--mut)}
/* pasek górny */
#top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20;flex-wrap:wrap}
#logo{font-weight:700;font-size:19px;color:var(--acc);margin-right:10px;white-space:nowrap}
#nav button{border:0;border-radius:0;background:none;padding:8px 10px;border-bottom:3px solid transparent}
#nav button.on{border-bottom-color:var(--acc);font-weight:700}
#sbox{position:relative;flex:1;min-width:180px;max-width:380px}
#q{width:100%;border-radius:20px;padding-left:14px}
#sres{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:30}
#sres div{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}#sres div:hover{background:var(--soft)}
#tools{display:flex;gap:6px;margin-left:auto;align-items:center}
#menu{position:absolute;right:16px;top:52px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px;display:none;z-index:40;width:280px}
#menu label{display:block;margin:6px 0}#menu hr{border:0;border-top:1px solid var(--line)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
/* awatary */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft);border:2px solid var(--m)}
.av.F{border-color:var(--f)}.av.U{border-color:var(--line)}
/* drzewo */
#tbar{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#wrap{position:relative;flex:1;min-height:420px}
#tv{position:absolute;inset:0;overflow:auto;background:var(--canvas);cursor:grab;touch-action:none;user-select:none}
#tv.drag{cursor:grabbing}#tv.drag .c{pointer-events:none}
#tv .c{position:absolute;width:220px;height:102px;background:var(--card);border:2px solid #17b4ce;border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.15)}#tv .c.sF{border-color:#fc8181}#tv .c.sU{border-color:#bbb}#tv .c .av{width:64px;height:64px;border:1px solid #ccc}
#tv .c:hover{border-color:var(--acc)}
#tv .c.me{box-shadow:0 0 0 3px var(--sel),0 1px 6px rgba(0,0,0,.15)}#tv .c.sel{box-shadow:0 0 0 3px var(--acc)}
#tv .c .t{min-width:0}#tv .c b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:18px;color:var(--ink)}
#tv .c small{display:block;margin-top:4px;font-size:14px;color:#595959}#tv .c .t i{display:block;font-style:normal;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tv .c .ed{position:absolute;right:8px;bottom:6px;font-size:15px;color:#595959;opacity:0;transition:opacity .15s}#tv .c:hover .ed{opacity:1}#tv .c .ed:hover{color:var(--sel)}#tv .c .ak{position:absolute;right:8px;top:7px;min-width:18px;height:18px;border-radius:9px;background:#49cf77;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;padding:0 4px}#tv .c .ak:hover{filter:brightness(.9)}
#tv .c.pc{border-width:1px;padding:0 14px 0 10px;gap:10px}#tv .c.pc.me{background:var(--card)}#tv .c.ph{border-radius:42px}#tv .c.ps{border-radius:23px;padding-left:5px}#tv .c.pt{border-radius:13px;padding:0 12px}#tv .c.pc .av{border-radius:50%!important}#tv .c.ph .av{width:64px;height:64px}#tv .c.ps .av{width:36px;height:36px}#tv .c.pc b{font-size:13px;font-weight:500;line-height:15px;-webkit-line-clamp:2}#tv .c.pt b{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}#tv .c.pc small{font-size:12px;margin-top:2px;color:#595959}#tv .c.pc.empty{color:#767676;font-size:12px;border:1px dashed #767676;background:transparent!important}#tv .c .ex{position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #999;line-height:15px;text-align:center;font-weight:700;color:#555}#tv .c .ex:hover{background:var(--sel);color:#fff}#tv .c.pm{border-radius:32px;padding-left:6px}#tv .c.pm .av{width:48px;height:48px}#tv .pbr{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #999;text-align:center;line-height:23px;font-weight:700;color:#555;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}#tv .pbr:hover,#tv .pbr.on{background:var(--sel);color:#fff;border-color:var(--sel)}@keyframes pls{0%{stroke-width:14;stroke-opacity:.9}100%{stroke-width:1;stroke-opacity:1}}.leaflet-interactive.pulse{animation:pls 1.4s ease-out}@keyframes bpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}.bpopw{padding:0!important;border-radius:10px!important;border:2px solid #f26a2e!important}.bpop{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:13px;line-height:1.3;animation:bpop .5s ease-out;transform-origin:bottom center}.bpop img{width:40px;height:40px;border-radius:50%;object-fit:cover}.vt{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}.vt button{border:0;border-radius:0}.vt button.on{background:var(--sel);color:#fff}
#tv .c.empty{border-style:dashed;color:var(--mut);justify-content:center;background:transparent}
#tv .up{position:absolute;top:-19px;right:16px;display:flex;gap:9px;padding:2px;cursor:pointer}#tv .up i{width:20px;height:11px;border-radius:4px;background:#8d9ab0}#tv .up:before{content:'';position:absolute;left:22px;right:22px;top:7px;border-top:1.5px solid #8d9ab0}#tv .up:after{content:'';position:absolute;left:50%;top:7px;height:12px;border-left:1.5px solid #8d9ab0}#tv .up:hover i,#tv .up.on i{background:var(--sel)}#tv .dn{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:26px;height:16px;line-height:14px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:0 0 12px 12px;font-weight:700;cursor:pointer}#tv .dn:hover{color:var(--sel)}
#tv svg{position:absolute;left:0;top:0;pointer-events:none}
#panel h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
#panel .fam{padding:4px 0}#panel .fam .av{width:36px;height:36px}
#panel .kv{display:grid;grid-template-columns:78px 1fr;gap:4px 8px;font-size:13px}
#panel{position:absolute;left:12px;top:12px;bottom:12px;width:340px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:auto;padding:16px;display:none;z-index:10}
#panel .x{position:absolute;right:8px;top:8px;border:0;font-size:18px;padding:0 8px}
#panel .big{width:96px;height:96px}
#panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}#panel .grid2 button{border-radius:6px;padding:6px}
/* profil */
.phead{background:var(--hdr);padding:24px 32px 56px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.phead .av{width:130px;height:130px;border-width:3px}
.phead h1{margin:0 0 6px;font-size:30px}
.ptabs{display:flex;gap:22px;padding:0 32px;margin-top:-34px;border-radius:24px 24px 0 0;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.ptabs span{padding:10px 2px;cursor:pointer;border-bottom:3px solid transparent}.ptabs span.on{border-bottom-color:var(--ink);font-weight:700}
.pbody{padding:24px 32px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.box{border:1px solid var(--line);border-radius:24px;padding:20px 24px;background:var(--card)}
.box h2{margin:0 0 12px;font-size:18px}
.fact{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--soft)}
.fact .y{font-size:20px;text-align:center}.fact .y small{display:block;font-size:11px}
.fam{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer}.fam:hover b{text-decoration:underline}
.ph{display:inline-block;margin:0 10px 10px 0;vertical-align:top;width:150px}
.ph img{width:150px;height:150px;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in}
.ph button{font-size:12px;padding:2px 8px;margin:4px 4px 0 0}
.form{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;align-items:center;max-width:640px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{white-space:pre-wrap}
/* lista osób */
#people{padding:16px 32px;overflow:auto}
#people table{border-collapse:collapse;width:100%}#people td,#people th{padding:6px 10px;border-bottom:1px solid var(--soft);text-align:left}
#people tr:hover td{background:var(--soft);cursor:pointer}
.empty-state{max-width:560px;margin:60px auto;text-align:center}
@media (max-width:760px){.pbody{grid-template-columns:1fr;padding:16px}.phead{padding:16px 16px 50px}.ptabs{padding:12px 16px 0;overflow:auto}#people{padding:12px}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:60%;border-radius:12px 12px 0 0}#logo{font-size:16px}}
.nmd table.ntab{border-collapse:collapse;margin:8px 0;font-size:13px}.nmd .ntab td,.nmd .ntab th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.nmd h3,.nmd h4{margin:14px 0 6px}.nmd p{margin:6px 0}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<body>
<div id="top">
  <span id="logo">🌳 Drzewo rodu</span>
  <span id="nav"><button data-v="drzewo">Drzewo</button><button data-v="przodkowie">Przodkowie</button><button data-v="profil">Profil</button><button data-v="osoby">Osoby</button><button data-v="mapa">Mapa</button><button data-v="notatki">Notatki</button><button data-v="siec">Sieć</button><button data-v="kontrola">Sprzeczności</button><button data-v="analizy">Analizy</button></span>
  <div id="sbox"><input id="q" placeholder="Szukaj osoby…" autocomplete="off"><div id="sres"></div></div>
  <div id="tools">
    <button id="undo" onclick="undo()" disabled title="Ctrl+Z">↶ Cofnij</button>
    <button class="pri" id="save" title="Pobierz plik do importu w MyHeritage">Zapisz .ged</button>
    <button id="mbtn" title="Więcej">☰</button>
  </div>
  <div id="menu">
    <button class="pri" onclick="openFile()" style="width:100%">Otwórz plik .ged</button><button onclick="if(confirm('Zacząć nowe, puste drzewo? Obecne drzewo zostaje w swoim pliku .ged – zapisz najpierw zmiany.')){roots=[];byId={};$('#menu').style.display='none';render()}" style="width:100%;margin-top:6px">Nowe drzewo…</button><input type="file" id="file" accept=".ged" hidden>
    <small>Zmiany zapisują się do tego samego pliku (Ctrl+S).</small>
    <label><b>Porównaj z innym drzewem</b><input type="file" id="cmp" accept=".ged"></label>
    <small id="cmpinfo"></small>
    <hr>
    <label><b>Wygląd</b><select id="theme"><option value="light">Jasny</option><option value="dark">Ciemny</option><option value="auto">Jak w systemie</option></select></label>
    <hr><small id="stat"></small>
  </div>
</div>
<main id="main"></main>
<script>
// ======== GEDCOM: węzły {lvl,id,tag,val,kids}, zapis 1:1 z powrotem ========
let topView=false,keepView=null,lastTap={},roots=[],byId={},cur=null,sel=null,view='drzewo',ptab='szczegoly',gens=3,dgens=1,zoomLvl=1,all=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseTo(text){
  const roots=[],byId={},st=[];let last=null;
  for(const raw of text.split(/\r?\n/)){
    // MyHeritage wstawia do notatek „gołe” nowe linie (bez poziomu) – to ciąg dalszy poprzedniej wartości, nie wolno ich gubić
    const m=raw.match(/^\s*(\d+)\s+(@[^@]+@\s+)?([A-Z_][A-Z0-9_]*)(?: (.*))?$/);
    if(!m||+m[1]>st.length){if(last&&raw!=='')last.val+='\n'+raw;continue}
    const n={lvl:+m[1],id:m[2]?m[2].trim():null,tag:m[3],val:m[4]||'',kids:[]};
    if(n.tag==='CONC'||n.tag==='CONT'){const p=st[n.lvl-1];if(p){p.val+=(n.tag==='CONT'?'\n':'')+n.val;last=p;continue}}
    st.length=n.lvl;(n.lvl?st[n.lvl-1].kids:roots).push(n);st[n.lvl]=n;last=n;if(n.id)byId[n.id]=n;
  }
  return {roots,byId};
}
function parse(text){({roots,byId}=parseTo(text))}
// nowe drzewo bez pliku: minimalny GEDCOM (nagłówek, autor = pierwsza osoba, ta osoba), od razu zapis do wybranego pliku .ged
function newTree({g,s,x,b,p}){const c=t=>String(t||'').replace(/[\r\n]+/g,' ').trim(),G=c(g),S=c(s);
  const ged=['0 HEAD','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 SOUR DRZEWO_RODU','1 SUBM @U1@','0 @U1@ SUBM',`1 NAME ${G} ${S}`,
    '0 @I1@ INDI',`1 NAME ${G} /${S}/`,`2 GIVN ${G}`,`2 SURN ${S}`,`1 SEX ${x==='F'?'F':'M'}`,...(c(b)||c(p)?['1 BIRT',...(c(b)?[`2 DATE ${c(b).toUpperCase()}`]:[]),...(c(p)?[`2 PLAC ${c(p)}`]:[])]:[]),'0 TRLR'].join('\n');
  location.hash='@I1@';fileHandle=null;load(ged);setHandle(null);saveFile()} // Chrome/Edge: okno „Zapisz jako”, inne: pobranie pliku
function ser(){ // linie >200 znaków (np. zdjęcia) dzielone na CONC – limit GEDCOM 255
  const out=[],ch=s=>s.match(/[\s\S]{1,200}/g)||[''];
  const w=n=>{const ls=n.val.split('\n'),c=n.lvl+1,f=ch(ls[0]);
    out.push(`${n.lvl}${n.id?' '+n.id:''} ${n.tag}${f[0]?' '+f[0]:''}`);f.slice(1).forEach(x=>out.push(`${c} CONC ${x}`));
    ls.slice(1).forEach(l=>{const p=ch(l);out.push(`${c} CONT ${p[0]}`);p.slice(1).forEach(x=>out.push(`${c} CONC ${x}`))});
    n.kids.forEach(w)};
  roots.forEach(w);return out.join('\r\n')+'\r\n';
}
const kid=(n,t)=>n&&n.kids.find(k=>k.tag===t), kids=(n,t)=>n?n.kids.filter(k=>k.tag===t):[];
const sub=(n,path)=>path.split('.').reduce((a,t)=>kid(a,t),n);
const name=p=>(p&&sub(p,'NAME')?.val.replace(/\//g,'').replace(/\s+/g,' ').trim())||'(bez imienia)';
const yr=(p,ev)=>(sub(p,ev+'.DATE')?.val||'').match(/\d{4}/)?.[0]||'';
const life=p=>{const b=yr(p,'BIRT'),d=yr(p,'DEAT');return b||d?`${b||'?'} – ${d||(kid(p,'DEAT')?'?':'')}`:''};
const sex=p=>kid(p,'SEX')?.val||'U';
const cardName=p=>{const n=sub(p,'NAME');let g=(n?.val.split('/')[0]||'').replace(/\s*,\s*/g,' ').trim();const sn=(n?.val.split('/')[1]||'').trim(),m=(sub(n,'_MARNM')?.val||'').split('/')[0].trim();
  const fit=x=>(g+' '+x).length>20?g.split(' ')[0]:g; // długie imiona: na karcie tylko pierwsze (pełne w profilu)
  return m&&m!==sn&&sex(p)==='F'?{n:`${fit(m)} ${m}`.trim(),z:sn?`(z d. ${sn})`:''}:{n:`${fit(sn)} ${sn}`.trim()||name(p),z:''}};
const aktCnt=p=>kids(p,'OBJE').filter(o=>/^Akt/i.test(sub(o,'TITL')?.val||'')).length;
const indis=()=>roots.filter(n=>n.tag==='INDI');
const famsOf=(p,t)=>kids(p,t).map(k=>byId[k.val]).filter(Boolean);
// małżeństwa osoby w kolejności: wg roku ślubu, gdy wszystkie mają datę; inaczej kolejność z pliku (= kolejność z MyHeritage)
const marrOrd=p=>{const fs=famsOf(p,'FAMS'),y=fs.map(f=>+yr(f,'MARR')||0);return y.every(Boolean)?fs.map((f,i)=>[f,y[i]]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]):fs};
const spouseIn=(f,id)=>byId[kid(f,kid(f,'HUSB')?.val===id?'WIFE':'HUSB')?.val];
const parentsOf=p=>famsOf(p,'FAMC').flatMap(f=>['HUSB','WIFE'].map(t=>byId[kid(f,t)?.val])).filter(Boolean);
const childrenOf=p=>famsOf(p,'FAMS').flatMap(f=>kids(f,'CHIL').map(c=>byId[c.val])).filter(Boolean);
const siblingsOf=p=>famsOf(p,'FAMC').flatMap(f=>kids(f,'CHIL').map(c=>byId[c.val])).filter(s=>s&&s!==p);
const ev=(p,t)=>{const e=kid(p,t);return e?[sub(e,'DATE')?.val,sub(e,'PLAC')?.val].filter(Boolean).join(' • '):''};
const MONTHS={JAN:'sty',FEB:'lut',MAR:'mar',APR:'kwi',MAY:'maj',JUN:'cze',JUL:'lip',AUG:'sie',SEP:'wrz',OCT:'paź',NOV:'lis',DEC:'gru',ABT:'około',BEF:'przed',AFT:'po',EST:'ok.',CAL:'wyl.',BET:'między',AND:'a'};
const pdate=s=>(s||'').replace(/\b[A-Z]{3}\b/g,m=>MONTHS[m]||m);
const SIL='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#e3e3e3"/><circle cx="20" cy="15" r="7" fill="#bbb"/><path d="M6 38c1-9 7-13 14-13s13 4 14 13z" fill="#bbb"/></svg>');
const photo=p=>kids(p,'OBJE').filter(o=>!/^Akt/i.test(sub(o,'TITL')?.val||'')).map(o=>sub(o,'FILE')?.val).find(Boolean)||''; // skany aktów nie są zdjęciem profilowym
const avatar=(p,cls='')=>`<img class="av ${sex(p)} ${cls}" src="${esc(photo(p)||SIL)}" onerror="this.src='${SIL}'" draggable="false" alt="">`;

// ======== edycja węzłów ========
function setKid(n,tag,val){let k=kid(n,tag);if(!val){if(k)n.kids.splice(n.kids.indexOf(k),1);return}
  if(!k){k={lvl:n.lvl+1,id:null,tag,val:'',kids:[]};n.kids.push(k)}k.val=val;return k}
function setEv(p,t,date,plac){if(!date&&!plac){setKid(p,t,'');return}const e=kid(p,t)||setKid(p,t,'Y');e.val='';setKid(e,'DATE',date);setKid(e,'PLAC',plac)}
function newId(pre){let i=1;while(byId[`@${pre}${i}@`])i++;return `@${pre}${i}@`}
function newNode(tag,pre){const n={lvl:0,id:newId(pre),tag,val:'',kids:[]};const tr=roots.findIndex(r=>r.tag==='TRLR');roots.splice(tr<0?roots.length:tr,0,n);byId[n.id]=n;return n}
const ref=(n,tag,id)=>n.kids.push({lvl:n.lvl+1,id:null,tag,val:id,kids:[]});
// najpierw pytamy o dane, dopiero potem tworzymy węzły – anulowanie nic nie zostawia

const WHO={father:['ojca','M'],mother:['matki','F'],brother:['brata','M'],sister:['siostry','F'],son:['syna','M'],daughter:['córki','F'],husband:['męża','M'],wife:['żony','F']};

// ======== widok drzewa (jak MyHeritage) ========
// ======== widok rodziny jak w MyHeritage ========
// przodkowie w górę (gens), przy każdym przodku jego rodzeństwo z małżonkami; kwadraciki nad osobą = rozwiń jej rodziców w miejscu,
// „+” pod osobą = rozwiń jej dzieci w miejscu. Układ: bloki z konturem per wiersz, dosuwane bez nakładania.
const expU=new Set(),expD=new Set();
// linia rodzic→dziecko: w dół, poziomo z zaokrąglonymi narożnikami (jak MyHeritage), w dół do karty
const elbow=(x1,y1,x2,yb,y2)=>{const d=x2-x1,r=Math.min(30,Math.abs(d)/2,yb-y1,y2-yb),s=Math.sign(d);if(!r)return`M${x1} ${y1}V${yb}H${x2}V${y2}`;
  return`M${x1} ${y1}V${yb-r}Q${x1} ${yb} ${x1+s*r} ${yb}H${x2-s*r}Q${x2} ${yb} ${x2} ${yb+r}V${y2}`};
// siła dowodu powiązania: a = skan aktu, i = indeks/odpis (Geneteka, nr aktu), r = przekaz/drzewo, h = hipoteza
const EVC={a:'#2b8a3e',i:'#e6a700',r:'#f08c00',h:'#e03131'},EVT={a:'skan aktu',i:'indeks / odpis aktu',r:'przekaz rodzinny / drzewo',h:'hipoteza'};var evMode=false;
const txtOf=n=>!n||n.tag==='OBJE'?'':(n.val||'')+' '+n.kids.map(txtOf).join(' ');
const hasAkt=(n,re)=>n&&kids(n,'OBJE').some(o=>re.test(sub(o,'TITL')?.val||''));
function evOf(kind,p,f){
  if(kind==='k'){const t=txtOf(p)+' '+(f?kids(f,'NOTE').map(txtOf).join(' '):'');if(/HIPOTEZA \(niepotwierdzona\)/i.test(t))return'h';
    if(hasAkt(p,/^Akt (urodz|chrzt)|^Akt.*(chrzest|chrztu|urodzenia)/i))return'a';if(/Geneteka|Akt (ur|chrz)|akt nr|akt \d/i.test(t)||kid(p,'SOUR'))return'i';return'r'}
  const sp=f?['HUSB','WIFE'].map(k=>byId[kid(f,k)?.val]):[],t=txtOf(f);if(/HIPOTEZA \(niepotwierdzona\)/i.test(t))return'h';
  if(hasAkt(f,/^Akt.*ślub/i)||sp.some(x=>hasAkt(x,/^Akt.*ślub/i)))return'a';if(/Geneteka|akt ślubu|Akt ślubu/i.test(t)||kid(f,'SOUR'))return'i';return'r'}
// podsumowanie dla całego drzewa: ile powiązań rodzic–dziecko na jakim dowodzie, do którego roku sięga ciąg aktów
function evStats(){const c={a:0,i:0,r:0,h:0};let oldest=null;indis().forEach(p=>{const f=famsOf(p,'FAMC')[0];if(!f)return;const k=evOf('k',p,f);c[k]++;const y=+yr(p,'BIRT')||+yr(p,'CHR');if(k==='a'&&y&&(!oldest||y<oldest))oldest=y});return{c,oldest}}
function layout(id){
  const CW=220,CH=102,GX=34,RH=170,cards=[],edges=[],shown=new Set();
  const box=c=>({cards:c?[c]:[],ct:c?new Map([[c.row,[c.x,c.x+CW]]]):new Map()});
  const mk=(per,row,cls='')=>{const c={x:0,row,per,cls};cards.push(c);per&&shown.add(per.id);return c};
  const shift=(b,dx)=>{b.cards.forEach(c=>c.x+=dx);b.ct.forEach(v=>{v[0]+=dx;v[1]+=dx});return b};
  const join=(a,b)=>{b.cards.forEach(c=>a.cards.push(c));b.ct.forEach(([l,r],k)=>{const v=a.ct.get(k);a.ct.set(k,v?[Math.min(v[0],l),Math.max(v[1],r)]:[l,r])});return a};
  const gap=(a,b,dx)=>{let need=null;b.ct.forEach(([l,r],k)=>{const v=a.ct.get(k);if(v&&l+dx<v[1]+GX&&r+dx>v[0]-GX){const n=v[1]+GX-l;need=need===null?n:Math.max(need,n)}});return need};
  const hcat=bs=>bs.reduce((a,b)=>{if(!a)return b;let dx=gap(a,b,-1e9);if(dx===null){dx=Math.max(...[...a.ct.values()].map(v=>v[1]))+GX-Math.min(...[...b.ct.values()].map(v=>v[0]))}
    return join(a,shift(b,dx))},null)||box();
  const under=(a,b,dx)=>{let n;while((n=gap(a,b,dx))!==null&&n>dx)dx=n;return join(a,shift(b,dx))}; // b w miejscu dx, przesunięte w prawo przy kolizji
  const P=x=>{const f=famsOf(x,'FAMC')[0];return f?[byId[kid(f,'HUSB')?.val],byId[kid(f,'WIFE')?.val],f]:[]};
  const ch=f=>kids(f,'CHIL').map(c=>byId[c.val]).filter(Boolean);
  // rodzina f: para (bloki pochodzenia obojga) + dzieci pod spodem; kidBox(c) daje blok dziecka i jego kartę
  const fst=new Set(),family=(f,row,depth,kidBox,order)=>{if(fst.has(f))depth=-1e9;fst.add(f);try{return fam1(f,row,depth,kidBox,order)}finally{fst.delete(f)}};
  const fam1=(f,row,depth,kidBox,order)=>{const h=byId[kid(f,'HUSB')?.val],w=byId[kid(f,'WIFE')?.val];
    const H=h?origin(h,row,depth,'L'):{b:box(mk(null,row,'empty'))},W=w?origin(w,row,depth,'R'):{b:box(mk(null,row,'empty'))};
    const top=hcat([H.b,W.b]),ca=H.b.cards.find(c=>c.row===row&&c.per===h)||H.b.cards[0],cb=W.b.cards.find(c=>c.row===row&&c.per===w)||W.b.cards[0];
    edges.push(['m',ca,cb,false,f]);let kl=ch(f);if(order&&row<-2&&!expD.has(h?.id)&&!expD.has(w?.id))kl=[order[0]]; // rodzeństwo dalszych przodków po kliknięciu „+”
    if(order){const o=kl.filter(c=>c!==order[0]);kl=order[1]==='L'?[...o,order[0]]:[order[0],...o]}const ks=kl.map(kidBox);if(!ks.length)return{b:top,ca,cb};
    const kb=hcat(ks.map(k=>k.b)),kc=ks.map(k=>k.c),mid=(ca.x+cb.x+CW)/2,kmid=(kc[0].x+kc[kc.length-1].x+CW)/2;
    edges.push(['k',ca,cb,kc,false,f]);return{b:under(top,kb,mid-kmid),ca,cb}};
  // blok pochodzenia osoby x: jej rodzice (+dalsi przodkowie) nad nią, rodzeństwo obok; sama x bez własnej rodziny
  const origin=(x,row,depth,side)=>{const [h,w,f]=P(x),d=expU.has(x.id)&&depth>-1e8?Math.max(depth,1):depth;
    if(!f||d<1){const c=mk(x,row);return{b:box(c),c}}
    let me;const r=family(f,row-1,d-1,c=>c===x?(me={b:box(mk(x,row)),c:null},me.c=me.b.cards[0],me):down(c,row,false),[x,side]);return{b:r.b,c:me.c}};
  // blok potomny: osoba + małżonkowie (ich rodzice rozwijani na żądanie) + dzieci, jeśli rozwinięte
  const down=(x,row,open)=>{const fs=famsOf(x,'FAMS');const me=mk(x,row,x.id===id?'me':'');let b=box(me);const showK=open||expD.has(x.id);
    // jak MyHeritage: kobieta zawsze po prawej; kolejni małżonkowie dalej w tę samą stronę, linia przerywana, dzieci spod karty małżonka
    const fem=sex(x)==='F',parts=marrOrd(x).map((f,i)=>{const s=spouseIn(f,x.id),o=s?origin(s,row,0,fem?'L':'R'):{b:box(mk(null,row,'empty'))};o.c=o.c||o.b.cards[0];edges.push(['m',me,o.c,i>0,f]);return{f,c:o.c,b:o.b,i}});
    b=hcat(fem?[...parts.map(q=>q.b).reverse(),b]:[b,...parts.map(q=>q.b)]);
    if(!showK)return{b,c:me};const ks=[];
    (fem?[...parts].reverse():parts).forEach(({f,c,i})=>{const k=ch(f).map(k=>down(k,row+1,open&&row+1<dgens));if(k.length){ks.push(...k);edges.push(['k',me,c,k.map(z=>z.c),i>0,f])}});
    if(!ks.length)return{b,c:me};const xs=[me,...parts.map(q=>q.c)].map(c=>c.x),kb=hcat(ks.map(k=>k.b)),mid=(Math.min(...xs)+Math.max(...xs)+CW)/2,kmid=(ks[0].c.x+ks.at(-1).c.x+CW)/2;
    return{b:under(b,kb,mid-kmid),c:me}};
  const p=byId[id],[h,w,f]=P(p);let root;
  if(f&&gens>0)root=family(f,-1,gens-1,c=>down(c,0,c===p)).b;else root=down(p,0,true).b;
  // współrzędne
  const minR=Math.min(...cards.map(c=>c.row)),minX=Math.min(...cards.map(c=>c.x));
  cards.forEach(c=>{c.x+=20-minX;c.y=(c.row-minR)*RH+30});
  const lines=[],dash=[],ev=[];edges.forEach(e=>{if(e[0]==='m'){const[_,a,b,far,f]=e,[l,r]=a.x<b.x?[a,b]:[b,a];if(far)dash.push(`M${b.x<a.x?b.x+CW:b.x} ${a.y+CH/2}h${b.x<a.x?GX:-GX}`);else{lines.push(`M${l.x+CW} ${a.y+CH/2}H${r.x}`);ev.push([lines.length-1,evOf('m',null,f)])}}else{const[_,a,b,ks,far,f]=e,mx=far?b.x+CW/2:(Math.min(a.x,b.x)+CW+Math.max(a.x,b.x))/2,y=far?b.y+CH:a.y+CH/2;
    ks.forEach(k=>{lines.push(elbow(mx,y,k.x+CW/2,k.y-30,k.y));if(k.per)ev.push([lines.length-1,evOf('k',k.per,f)])})}});
  return{cards:cards.map(c=>({x:c.x,y:c.y,per:c.per,cls:c.per?c.cls:'empty'})),lines,dash,ev,W:Math.max(...cards.map(c=>c.x))+CW+20,H:Math.max(...cards.map(c=>c.y))+CH+40};
}
// całe drzewo: las potomków od wszystkich najstarszych przodków; dzieci rodziny rysowane raz – pod mężem (lub pod żoną, jeśli tylko ona ma rodziców w drzewie)
function layoutAll(){
  const CW=220,CH=102,GX=34,RH=180,slotW=CW+GX,cards=[],lines=[],dash=[],ev=[],seen=new Set(),hasP=x=>x&&famsOf(x,'FAMC').length>0;
  const ch=f=>kids(f,'CHIL').map(c=>byId[c.val]).filter(Boolean);
  const owner=f=>{const h=byId[kid(f,'HUSB')?.val],w=byId[kid(f,'WIFE')?.val];return h&&(hasP(h)||!hasP(w))?h:w};
  const build=x=>{seen.add(x.id);return{x,fams:marrOrd(x).map(f=>({fam:f,sp:spouseIn(f,x.id),kids:owner(f)===x?ch(f).filter(c=>!seen.has(c.id)).map(c=>(seen.add(c.id),c)).map(build):[]}))}};
  const roots=indis().filter(x=>!hasP(x)&&!seen.has(x.id)&&(!famsOf(x,'FAMS').length||famsOf(x,'FAMS').some(f=>owner(f)===x))).map(build);
  indis().filter(x=>!seen.has(x.id)&&!famsOf(x,'FAMS').some(f=>seen.has(spouseIn(f,x.id)?.id))).forEach(x=>roots.push(build(x))); // reszta (np. pętle)
  const w=n=>n.w??=Math.max((1+n.fams.length)*slotW,n.fams.reduce((a,f)=>a+f.kids.reduce((b,c)=>b+w(c),0),0));
  // małżonkowie na przemian po prawej/lewej (para zawsze obok siebie); dzieci każdej pary pod nią, w kolejności od lewej
  const place=(n,k,left,y0)=>{const own=(1+n.fams.length)*slotW,l0=left+(n.w-own)/2,y=y0+k*RH,fem=sex(n.x)==='F',nf=n.fams.length,px=fem?l0+nf*slotW:l0;cards.push({x:px,y,per:n.x,cls:n.x.id===cur?'me':''});
    let kl=left+(n.w-n.fams.reduce((a,f)=>a+f.kids.reduce((b,c)=>b+c.w,0),0))/2;
    const sl=n.fams.map((f,i)=>({f,i,sx:px+(fem?-(i+1):i+1)*slotW}));if(fem)sl.reverse(); // dzieci od lewej
    sl.forEach(({f,i,sx})=>{const a=Math.min(px,sx),b=Math.max(px,sx),far=i>0,mid=far?sx+CW/2:(a+CW+b)/2,y1=far?y+CH:y+CH/2;cards.push({x:sx,y,per:f.sp,cls:f.sp?'':'empty'});

function facts(p){

  const plk=(pl,y)=>pl?`<span class="lnk plac" data-pl="${esc(pl)}" data-y="${y||''}" title="Pokaż na mapie z tamtej epoki">${esc(pl)} 🗺</span>`:'';
  const evf=(t,title)=>{const e=kid(p,t);if(e)push(+yr(p,t)||null,title,[esc(pdate(sub(e,'DATE')?.val)),plk(sub(e,'PLAC')?.val,+yr(p,t))].filter(Boolean).join('<br>'),t==='BIRT'?0:t==='DEAT'?8:t==='BURI'?9:5)};
  evf('BIRT','Narodziny');evf('CHR','Chrzest');
  famsOf(p,'FAMS').forEach(f=>{const sp=spouseIn(f,p.id),m=kid(f,'MARR'),y=+((sub(f,'MARR.DATE')?.val||'').match(/\d{4}/)?.[0])||null;
    push(y,'Ślub z',`${sp?`<span class="lnk" onclick="go('${sp.id}','profil')">${esc(name(sp))}</span>`:'nieznany'}${m?'<br>'+[esc(pdate(sub(m,'DATE')?.val)),plk(sub(m,'PLAC')?.val,y)].filter(Boolean).join(' • '):''}`,2);
    kids(f,'CHIL').map(c=>byId[c.val]).filter(Boolean).forEach(c=>push(+yr(c,'BIRT')||null,`Urodziny ${sex(c)==='F'?'córki':sex(c)==='M'?'syna':'dziecka'}`,`<span class="lnk" onclick="go('${c.id}','profil')">${esc(name(c))}</span><br>${esc(pdate(ev(c,'BIRT')))}`,3))});
  kids(p,'OCCU').forEach(o=>push(null,'Zawód',esc(o.val),4));kids(p,'RESI').forEach(r=>push(+((sub(r,'DATE')?.val||'').match(/\d{4}/)?.[0])||null,'Zamieszkanie',esc([pdate(sub(r,'DATE')?.val),sub(r,'PLAC')?.val].filter(Boolean).join(' • ')),4));
  evf('DEAT','Śmierć');evf('BURI','Pochówek');
  // bez roku: narodziny na początku, zgon/pochówek na końcu, reszta zaraz po narodzinach
  const key=f=>f.y??(f.order===0?-1e9:f.order>=8?1e9:(by||-1e9)+.5);
  out.sort((a,b)=>key(a)-key(b)||a.order-b.order);

}

function aStat(){const ps=indis(),life_=ps.filter(p=>by_(p)&&dy_(p)&&dy_(p)>=by_(p)),bins={};
  life_.forEach(p=>{const c=by_(p)-by_(p)%50;(bins[c]??=[]).push(dy_(p)-by_(p))});const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):'–';
  const mAge={M:[],F:[]};ps.forEach(p=>{const b=by_(p),m=Math.min(...famsOf(p,'FAMS').map(f=>+yr(f,'MARR')||9999));if(b&&m<9999&&m-b>12&&m-b<80)(mAge[sex(p)]||[]).push(m-b)});
  const kids5=life_.filter(p=>dy_(p)-by_(p)<5),gv=p=>(sub(p,'NAME.GIVN')?.val||sub(p,'NAME')?.val.split('/')[0]||'').trim().split(/[\s,]+/)[0],top=s=>{const c={};ps.filter(p=>sex(p)===s).forEach(p=>{const g=gv(p);if(g&&g.length>1)c[g]=(c[g]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10)};
  let son=0,sonN=0,dau=0,dauN=0;ps.forEach(p=>{const pa=parentsOf(p),f=pa.find(x=>sex(x)==='M'),m=pa.find(x=>sex(x)==='F');if(sex(p)==='M'&&f){sonN++;if(gv(p)===gv(f))son++}if(sex(p)==='F'&&m){dauN++;if(gv(p)===gv(m))dau++}});
  return`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
   <div class="box"><h3>Średnia długość życia</h3>${Object.keys(bins).sort().map(c=>`<p>ur. ${c}–${+c+49}: <b>${avg(bins[c])} lat</b> <small>(${bins[c].length} os.)</small></p>`).join('')}<p><small>Bez dzieci zmarłych przed 5. r.ż.: ${avg(life_.filter(p=>dy_(p)-by_(p)>=5).map(p=>dy_(p)-by_(p)))} lat</small></p></div>
   <div class="box"><h3>Wiek przy pierwszym ślubie</h3><p>Mężczyźni: <b>${avg(mAge.M)}</b> <small>(${mAge.M.length})</small></p><p>Kobiety: <b>${avg(mAge.F)}</b> <small>(${mAge.F.length})</small></p>
    <h3>Umieralność dzieci</h3><p><b>${life_.length?Math.round(kids5.length/life_.length*100):0}%</b> osób ze znanymi datami zmarło przed 5. rokiem życia (${kids5.length} z ${life_.length})</p></div>

    <h3>Dziedziczenie imion</h3><p>Syn ma imię ojca: <b>${sonN?Math.round(son/sonN*100):0}%</b> (${son}/${sonN})</p><p>Córka ma imię matki: <b>${dauN?Math.round(dau/dauN*100):0}%</b> (${dau}/${dauN})</p></div></div>`}

// 5. brakujące ogniwa: luki w danych, posortowane od najłatwiejszych do uzupełnienia (księgi 1808–1920 zwykle zindeksowane / online)
function aBraki(){const now=new Date().getFullYear(),out=[];
  indis().forEach(p=>{const b=by_(p),d=dy_(p),bp=kid(kid(p,'BIRT'),'PLAC')||kid(kid(p,'CHR'),'PLAC'),pa=parentsOf(p).length,mar=famsOf(p,'FAMS').length;

    if(mar&&famsOf(p,'FAMS').some(f=>!kid(f,'MARR')&&b&&b<1925))add('brak daty ślubu',1)});
  out.sort((a,b)=>b.sc-a.sc);const k=aSel.bk||'';const typy=[...new Set(out.map(o=>o.t.split(' –')[0]))];const f=out.filter(o=>!k||o.t.startsWith(k));

const parts=p=>{const v=sub(p,'NAME')?.val||'';return {g:nk(v.split('/')[0]).trim().split(' ')[0],s:nk(v.split('/')[1]).split(' ').filter(w=>w.length>2&&w!=='vel')}};
const fam=(db,p)=>{const f=t=>kids(p,t).map(k=>db.byId[k.val]).filter(Boolean);
  return {par:f('FAMC').flatMap(x=>['HUSB','WIFE'].map(t=>db.byId[kid(x,t)?.val])).filter(Boolean),
    sp:f('FAMS').map(x=>db.byId[kid(x,kid(x,'HUSB')?.val===p.id?'WIFE':'HUSB')?.val]).filter(Boolean),
    ch:f('FAMS').flatMap(x=>kids(x,'CHIL').map(c=>db.byId[c.val])).filter(Boolean)}};

function score(p,me,q,db){const a=parts(p),b=parts(q);if(!a.g||a.g!==b.g||!a.s.some(s=>b.s.includes(s)))return 0;
  let sc=50;for(const t of['BIRT','DEAT']){const x=+yr(p,t),y=+yr(q,t);if(!x||!y)continue;const d=Math.abs(x-y);if(d>5)return 0;sc+=d<=1?15:5}
  const fa=fam(me,p),fb=fam(db,q);for(const k of['par','sp','ch']){const B=given(fb[k]);if([...given(fa[k])].some(g=>B.has(g)))sc+=7}
  return Math.min(sc,100)}

function matchCard(p){const ms=matches(p);
  return `<div class="box"><h2>Dopasowania w: ${esc(other.file)}</h2>${ms.map(({q,s},i)=>{const f=fam(other,q),mine=fam({byId},p),missEv=['BIRT','DEAT'].filter(e=>!yr(p,e)&&yr(q,e));
    return `<div class="fact" style="grid-template-columns:70px 1fr"><div class="y">${s}%</div><div><b>${esc(oname(q))}</b> <small>${esc(pdate(ev(q,'BIRT')))} ${ev(q,'DEAT')?'– '+esc(pdate(ev(q,'DEAT'))):''}</small>
     <br><small>Rodzice:</small> ${f.par.map(odesc).join(', ')||'—'}<br><small>Małżonkowie:</small> ${f.sp.map(odesc).join(', ')||'—'}<br><small>Dzieci:</small> ${f.ch.map(odesc).join(', ')||'—'}
     ${kids(q,'NOTE').length?`<br><small>Notatka:</small> <span class="note">${esc(kids(q,'NOTE').map(n=>noteTxt(n.val)).join('\n'))}</span>`:''}
     <div class="row" style="margin-top:6px">${missEv.length?`<button onclick="takeEv('${p.id}',${i})">Przejmij ${missEv.map(e=>e==='BIRT'?'urodzenie':'zgon').join(' i ')}</button>`:''}
     ${!mine.par.length&&f.par.length?`<button onclick="takePar('${p.id}',${i})">Dodaj rodziców (${f.par.length})</button>`:''}</div></div></div>`}).join('')||'<small>Brak dopasowań.</small>'}</div>`}
const copyEv=(from,to,t)=>{const e=kid(from,t);if(e)setEv(to,t,sub(e,'DATE')?.val||'',sub(e,'PLAC')?.val||'')};
function takeEv(id,i){const p=byId[id],q=matches(p)[i].q;['BIRT','DEAT'].forEach(e=>{if(!yr(p,e)&&yr(q,e))copyEv(q,p,e)});
  setKid(p,'NOTE',[kid(p,'NOTE')?.val,`Dane przejęte z: ${other.file} (${oname(q)})`].filter(Boolean).join('\n'));matchCache={};persist();render()}
function takePar(id,i){const p=byId[id],q=matches(p)[i].q,pars=fam(other,q).par;
  const f=famsOf(p,'FAMC')[0]||(()=>{const f=newNode('FAM','F');ref(f,'CHIL',id);ref(p,'FAMC',f.id);return f})();
  for(const o of pars){const t=sex(o)==='F'?'WIFE':'HUSB';if(kid(f,t))continue;const nm=sub(o,'NAME')?.val||'';
    const n=mkPerson([nm.split('/')[0].trim(),(nm.split('/')[1]||'').trim()],sex(o));copyEv(o,n,'BIRT');copyEv(o,n,'DEAT');setKid(n,'NOTE',`Dodano z: ${other.file}`);ref(f,t,n.id);ref(n,'FAMS',f.id)}
  matchCache={};persist();render()}

// ======== zapis w przeglądarce + cofanie ========
// ponytail: localStorage ~5MB; cofanie trzyma pełne kopie (~0.5MB) – limit 30 kroków
let undoStack=[],lastSaved='';
const undoBtn=()=>{$('#undo').disabled=!undoStack.length;$('#undo').textContent=`↶ Cofnij${undoStack.length?' ('+undoStack.length+')':''}`};
let unsaved=false,asT=0; // autozapis: po każdej zmianie (z opóźnieniem 1,5 s) do otwartego pliku
function persist(){const s=ser();if(lastSaved&&s!==lastSaved){setDirty(true);unsaved=true;clearTimeout(asT);asT=setTimeout(()=>saveFile(true),1500);undoStack.push([lastSaved,cur]);if(undoStack.length>30)undoStack.shift()}lastSaved=s;matchCache={};undoBtn();
  idb('readwrite',st=>st.put(s,'ged')).catch(()=>alert('Nie udało się zapamiętać zmian w przeglądarce – kliknij „Zapisz”, żeby nie stracić zmian.'));try{localStorage.removeItem('ged')}catch(e){}}
function undo(){if(!undoStack.length)return;let at;[lastSaved,at]=undoStack.pop();unsaved=true;clearTimeout(asT);asT=setTimeout(()=>saveFile(true),1500);parse(lastSaved);matchCache={};undoBtn();if(byId[at])cur=at;sel=null;
  idb('readwrite',st=>st.put(lastSaved,'ged')).catch(()=>{});render()}
function load(text,keepDirty){parse(text);undoStack=[];lastSaved='';persist();if(!keepDirty)setDirty(false);const h=decodeURIComponent(location.hash.slice(1));cur=byId[h]?h:indis()[0]?.id;render()}
// zapis do tego samego pliku: File System Access API (Chrome/Edge); uchwyt pamiętany w IndexedDB
let fileHandle=null,fileMod=0; // fileMod: data zmiany pliku przy wczytaniu – chroni przed nadpisaniem nowszego pliku starą kopią
const idb=(mode,fn)=>new Promise((ok,no)=>{const r=indexedDB.open('drzewo',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>{const tx=r.result.transaction('h',mode),q=fn(tx.objectStore('h'));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>no(tx.error)};r.onerror=()=>no(r.error)});
const setHandle=h=>{fileHandle=h;$('#save').textContent=h?`Zapisz (${h.name})`:'Zapisz .ged';$('#save').title=h?'Zapisuje zmiany do otwartego pliku':'Pobierz plik';idb('readwrite',s=>s.put(h,'f')).catch(()=>{})};
async function openFile(){
  if(!window.showOpenFilePicker)return $('#file').click(); // inne przeglądarki: zwykłe wczytanie
  try{const [h]=await showOpenFilePicker({types:[{description:'GEDCOM',accept:{'text/plain':['.ged']}}]});
    const f=await h.getFile();load(await gedText(f));setHandle(h);setMod(f.lastModified);setDirty(false);$('#menu').style.display='none'}catch(e){}}
const setDirty=d=>idb('readwrite',s=>s.put(d,'dirty')).catch(()=>{});
const setMod=m=>{fileMod=m;idb('readwrite',s=>s.put(m,'mod')).catch(()=>{})};
async function saveFile(auto){
  if(auto===true&&!fileHandle)return; // autozapis tylko do otwartego pliku – bez pobierania kopii
  if(!fileHandle&&window.showSaveFilePicker&&auto!==true){try{setHandle(await showSaveFilePicker({suggestedName:'drzewo_uzupelnione.ged',types:[{description:'GEDCOM',accept:{'text/plain':['.ged']}}]}));fileMod=0}catch(e){return}}
  if(fileHandle){try{
    if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){if(auto===true)return;if(await fileHandle.requestPermission({mode:'readwrite'})!=='granted')throw 0}
    const disk=await fileHandle.getFile();
    if(disk.lastModified!==fileMod&&auto===true){$('#save').textContent='⚠ Plik zmieniony – kliknij, by zapisać';return} /* autozapis nie nadpisuje cudzych zmian */
    if(disk.lastModified!==fileMod&&(!confirm(`Plik „${fileHandle.name}” na dysku zmienił się od czasu wczytania (np. poprawiony gdzie indziej).
Nadpisać go tym, co jest teraz w aplikacji?

Anuluj = nie zapisuj; potem wczytaj plik ponownie (☰ → Otwórz plik).`)))return;
    const w=await fileHandle.createWritable();await w.write(ser());await w.close();setMod((await fileHandle.getFile()).lastModified);setDirty(false);unsaved=false;
    $('#save').textContent=auto===true?'✓ Zapisano automatycznie':'✓ Zapisano';setTimeout(()=>setHandle(fileHandle),1500);return}catch(e){if(auto===true)return;alert('Nie udało się zapisać do pliku – zostanie pobrana kopia.')}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ser()],{type:'text/plain'}));a.download=fileHandle?.name||'drzewo.ged';a.click()}

// przy wyjściu/przełączeniu karty: zapisz od razu; gdy zapis się nie udał – przeglądarka zapyta przed zamknięciem
addEventListener('visibilitychange',()=>{if(document.hidden&&unsaved){clearTimeout(asT);saveFile(true)}});
addEventListener('beforeunload',e=>{if(unsaved){saveFile(true);e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile()}});
$('#file').onchange=e=>{const f=e.target.files[0];if(f)gedText(f).then(t=>{load(t);$('#menu').style.display='none'});e.target.value=''};
$('#cmp').onchange=e=>{const f=e.target.files[0];if(f)gedText(f).then(t=>loadOther(t,f.name));e.target.value=''};
$('#save').onclick=saveFile;
onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();undo()}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back()}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();forward()}
  if(e.key==='Escape'){$('#sres').style.display='none';if(view==='drzewo'||view==='przodkowie')showPanel(null)}};
// motyw: wybiera użytkownik (domyślnie jasny jak MyHeritage)
const setTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').value=t;try{localStorage.setItem('theme',t)}catch(e){}};
$('#theme').onchange=e=>setTheme(e.target.value);
try{setTheme(localStorage.getItem('theme')||'light')}catch(e){setTheme('light')}
// start: ostatnio otwarty plik wczytywany automatycznie z dysku (jeśli przeglądarka pozwala); niezapisane zmiany mają pierwszeństwo
(async()=>{const g=k=>idb('readonly',st=>st.get(k)).catch(()=>null);
  const [h,mod,dirty]=[await g('f'),await g('mod'),await g('dirty')];let s=await g('ged');try{s=s||localStorage.getItem('ged')}catch(e){}
  const fromDisk=async()=>{const f=await h.getFile();load(await gedText(f));setMod(f.lastModified);setDirty(false)};
  if(h){setHandle(h);fileMod=mod||0;
    if(!dirty){try{if(await h.queryPermission({mode:'readwrite'})==='granted')return await fromDisk()}catch(e){}
      // przeglądarka wymaga jednego kliknięcia, by znów dać dostęp do pliku
      const b=document.createElement('div');b.id='reopen';b.innerHTML=`<button class="pri">Otwórz ${esc(h.name)}</button> <small>przeglądarka prosi o jedno kliknięcie, by wczytać plik z dysku</small>`;
      b.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center';
      b.querySelector('button').onclick=async()=>{try{if(await h.requestPermission({mode:'readwrite'})==='granted'){b.remove();await fromDisk()}}catch(e){b.remove();openFile()}};document.body.append(b)}}
  s?load(s,dirty):render()})();
</script>
</body>
</html>
