<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400"><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".1"/></filter></defs><rect width="1280" height="400" fill="#fff8f2"/><text x="640.0" y="70" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#222">Your data stays with you</text><g transform="translate(72.0,110)"><rect width="360" height="250" rx="18" fill="#fff" filter="url(#sh)"/><circle cx="180.0" cy="64" r="42" fill="#fff3ec"/><g transform="translate(180.0,64)"><rect x="-22" y="-6" width="44" height="34" rx="6" fill="#fff" stroke="#2f9e44" stroke-width="3"/><path d="M-12 -6v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#2f9e44" stroke-width="3"/><circle cx="0" cy="10" r="5" fill="#2f9e44"/></g><text x="180.0" y="134" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#222">No account, no cloud</text><text x="180.0" y="160" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">Your tree is a file on your disk.</text><text x="180.0" y="182" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">Nothing goes to our server.</text></g><g transform="translate(460.0,110)"><rect width="360" height="250" rx="18" fill="#fff" filter="url(#sh)"/><circle cx="180.0" cy="64" r="42" fill="#fff3ec"/><g transform="translate(180.0,64)"><path d="M-18 -26h24l12 12v40h-36z" fill="#fff" stroke="#555" stroke-width="2.5"/><path d="M6 -26v12h12" fill="none" stroke="#555" stroke-width="2.5"/><text x="0" y="12" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#f26a2e">.ged</text></g><text x="180.0" y="134" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#222">GEDCOM standard</text><text x="180.0" y="160" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">Open the same file in MyHeritage</text><text x="180.0" y="182" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">and other programs.</text></g><g transform="translate(848.0,110)"><rect width="360" height="250" rx="18" fill="#fff" filter="url(#sh)"/><circle cx="180.0" cy="64" r="42" fill="#fff3ec"/><g transform="translate(180.0,64)"><path d="M0 -28l24 9v14c0 17-10 28-24 33-14-5-24-16-24-33v-14z" fill="#e8f7fb" stroke="#17b4ce" stroke-width="2.5"/><path d="M-9 0l7 7 12-14" fill="none" stroke="#17b4ce" stroke-width="3" stroke-linecap="round"/></g><text x="180.0" y="134" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#222">Open source</text><text x="180.0" y="160" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">AGPL licence. Anyone can check</text><text x="180.0" y="182" text-anchor="middle" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#555">what the app does.</text></g></svg>